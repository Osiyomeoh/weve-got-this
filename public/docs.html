<html lang="en">
<head>

<style>
  :root{
    --bg:#ffffff; --sidebar:#fbfbfa; --content:#ffffff; --rail:#ffffff;

  /* Top bar */
  header{position:sticky;top:0;z-index:20;height:var(--h-top);display:flex;align-items:center;gap:18px;

  .pager .dir{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
  .pager .nm{font-weight:600;font-size:14px;margin-top:2px}

  /* Right rail */

  .toc .ttl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:10px}
  .toc a{display:block;color:var(--muted);font-size:12.8px;padding:4px 0 4px 11px;border-left:2px solid var(--line-2);line-height:1.4}
  .toc a:hover{color:var(--ink);text-decoration:none}
  .toc a.active{color:var(--accent-2);border-left-color:var(--accent);font-weight:600}

  .scrim{display:none}
  @media (max-width:1080px){ :root{--w-toc:0px} aside.toc{display:none} .shell{grid-template-columns:var(--w-nav) minmax(0,1fr)} }
  @media (max-width:820px){
    .shell{grid-template-columns:1fr}

    body.nav-open nav.side{transform:none}
    body.nav-open .scrim{display:block;position:fixed;inset:var(--h-top) 0 0 0;background:rgba(0,0,0,.4);z-index:25}
    main{padding:26px 18px 80px}

</style>

<script>
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);

/* ---- Content, authored as data. Each page has an id, group, title, a TOC and an HTML body. ---- */
const PAGES = [
  { id:'overview', group:'Get started', title:'Overview',
    toc:[['what','What it is'],['why','Why MCP']],
    body:`
    <div class="tag">We've Got This · MCP 2026-07-28 and 2025-11-25</div>
    <h1>The care layer, as an MCP server</h1>
    <p class="lead">We've Got This tracks what needs to happen for someone being cared for, and who is responsible for it - and exposes that as <b>31 MCP tools</b> an AI assistant (Alexa+, or any MCP client) calls. Real events flow in from real accounts and devices; every one enters as a guess a human confirms, never a fact written by a machine.</p>
    <h2 id="what">What it is</h2>
    <div class="cards">
      <div class="card"><h4>Self-hosted MCP</h4><p>Streamable HTTP, live on AWS App Runner. It speaks MCP 2025-11-25 (sessions) and 2026-07-28 (stateless) on the same endpoint, with the same tools.</p></div>
      <div class="card"><h4>Real connections</h4><p>Calendar, Gmail, Ring, Bee, WhatsApp, Telegram. Network at the edges, a pure core.</p></div>
      <div class="card"><h4>Provenance-first</h4><p>Known ≠ assumed. Every claim carries where it came from; a guess stays a guess until confirmed.</p></div>
    </div>
    <h2 id="why">Why MCP</h2>
    <p>The Model Context Protocol lets an assistant call typed tools over a standard transport. We've Got This is a self-hosted MCP server on <a href="https://modelcontextprotocol.io/specification/2025-11-25/basic/transports#streamable-http" target="_blank" rel="noreferrer">Streamable HTTP</a>, so the whole care layer is one clean surface an Alexa+ agent drives - the messy platform APIs never leak into it.</p>` },

  { id:'architecture', group:'Get started', title:'Architecture',
    toc:[['spine','The spine'],['edges','Network at the edges']],
    body:`
    <div class="crumb">Get started <b>› Architecture</b></div>
    <h1>Architecture</h1>
    <p class="lead">One spine runs the whole system: events are the only source of truth, obligations fold out of them, and ownership is where care succeeds or slips.</p>
    <h2 id="spine">The spine</h2>
    <div class="flow">EVENTS  ──►  OBLIGATIONS  ──►  OWNERSHIP
(append-only)   (folded from events)   (who is responsible)

A Care Gap = a failure at the ownership stage: real work with no owner,
an expected record that is missing, or something now past its time.</div>
    <h2 id="edges">Network at the edges, pure core</h2>
    <p>Every connector follows one shape, so the store-touching logic is testable without a socket:</p>
    <div class="flow">&lt;x&gt;ConfigFromEnv  →  fetch&lt;X&gt;  →  sync&lt;X&gt;  →  run&lt;X&gt;Sync
 (reads env)       (only network)  (pure, idempotent) (wires them)</div>
    <p>Inbound webhooks (Ring, WhatsApp, Telegram) and pollers (Calendar, Gmail, Bee) all land in the same store the MCP tools read and write - a reply over Telegram travels the exact path a spoken one does.</p>` },

  { id:'trust', group:'Get started', title:'The trust model',
    toc:[['prov','Provenance'],['conf','Confidence'],['rule','The rule']],
    body:`
    <div class="crumb">Get started <b>› The trust model</b></div>
    <h1>The trust model</h1>
    <p class="lead">The thesis of the whole system: a machine never writes a fact. A real event enters as a signal → an INFERRED item → a human confirms → a fact. Evidence is not a verdict.</p>
    <h2 id="prov">Provenance - how sure we are of an obligation</h2>
    <p><span class="chip c-conf">CONFIRMED</span> a person stated it &nbsp; <span class="chip c-inf">INFERRED</span> the system guessed it - never counted until confirmed &nbsp; <span class="chip c-nr">NOT_LOGGED</span> nothing was recorded - <i>not</i> "it didn't happen"</p>
    <h2 id="conf">Confidence - how sure we are of an event</h2>
    <p>Deliberately separate from provenance. An event can be <code>observed</code> while the obligation it feeds is still only INFERRED.</p>
    <ul>
      <li><code>observed</code> - a sensor saw it happen</li>
      <li><code>reported</code> - a person said it happened</li>
      <li><code>inferred</code> - the system derived it from other events</li>
      <li><code>confirmed</code> - a person definitively decided or acted</li>
    </ul>
    <h2 id="rule">The rule that never bends</h2>
    <div class="note"><p>The system only knows what was recorded. An absent record is never evidence that something didn't happen - no tool ever says a person failed to do something.</p></div>` },

  { id:'tools', group:'Reference', title:'MCP tools',
    toc:[['read','See the state'],['own','Ownership'],['record','Record reality'],['act','Act outward'],['admin','Setup & admin']],
    body:`
    <div class="crumb">Reference <b>› MCP tools</b></div>
    <h1>MCP tools <span class="tag" style="vertical-align:middle">29</span></h1>
    <p class="lead">You don't call these by hand - you speak, and the planner picks the tool. Grouped by what they do.</p>
    <h2 id="read">See the state · read-only</h2>
    <div class="cards">
      <div class="card"><h4>get_care_gaps</h4><p>The core tool: everything unowned, missing, or overdue - ranked, phrased for speech.</p></div>
      <div class="card"><h4>get_care_summary</h4><p>The day: what's logged, notes, what's coming up.</p></div>
      <div class="card"><h4>get_shift_brief</h4><p>What this shift needs to know - meds due, what's on you.</p></div>
      <div class="card"><h4>get_promises</h4><p>This week's promises: who said yes to what, any "still on?" and its answer, what's done, and what the doorbell saw beside it.</p></div>
      <div class="card"><h4>get_my_requests</h4><p>What you've been asked to take on and not yet answered.</p></div>
      <div class="card"><h4>get_provenance</h4><p>Walks the whole chain behind one item - "how do you know that?"</p></div>
      <div class="card"><h4>get_connections</h4><p>Each data door: live / configured / not connected. Honest, env-checked.</p></div>
      <div class="card"><h4>get_started</h4><p>Set up, or pick up where onboarding left off.</p></div>
    </div>
    <h2 id="own">Ownership · the delegation loop</h2>
    <div class="cards">
      <div class="card"><h4>request_owner</h4><p>Ask someone to take work on - and message them (Telegram/WhatsApp). Asks, never assigns.</p></div>
      <div class="card"><h4>respond_to_request</h4><p>Answer a request made of you: accept (assign) or decline (reopen).</p></div>
      <div class="card"><h4>claim_obligation</h4><p>The speaker takes something on themselves.</p></div>
      <div class="card"><h4>assign_obligation</h4><p>The primary caregiver gives work to someone. It asks them; it is theirs once they say yes.</p></div>
      <div class="card"><h4>confirm_proposal</h4><p>Confirm or dismiss something the system guessed.</p></div>
      <div class="card"><h4>resolve_obligation</h4><p>Mark something done.</p></div>
    </div>
    <h2 id="record">Record reality</h2>
    <div class="cards">
      <div class="card"><h4>log_care_event</h4><p>Log something that happened - a dose, a meal - as reported.</p></div>
      <div class="card"><h4>record_appointment</h4><p>A dated commitment; proposes the ride/companion a medical one needs.</p></div>
      <div class="card"><h4>add_note</h4><p>Add a note to the care record.</p></div>
      <div class="card"><h4>change_appointment</h4><p>An appointment moved or was cancelled. The ride moves with it, and whoever had it is told.</p></div>
      <div class="card"><h4>change_medication</h4><p>The doctor changed a dose, a time, or when to stop.</p></div>
      <div class="card"><h4>set_routine</h4><p>Care that comes round again - lunch, someone there at night, the diesel. Set up once; each time it asks who has it.</p></div>
      <div class="card"><h4>record_order</h4><p>Someone ordered it in, wherever they already shop. Records who ordered it and who takes it in; nothing is bought here.</p></div>
      <div class="card"><h4>ingest_signal</h4><p>The single source-agnostic front door: record something a device observed.</p></div>
    </div>
    <h2 id="act">Act outward &nbsp;·&nbsp; the agent</h2>
    <div class="cards">
      <div class="card"><h4>raise_urgent</h4><p>Something urgent ("he has fallen"): every phone at once, and the emergency number.</p></div>
      <div class="card"><h4>notify_member</h4><p>Let someone know - recorded always, pushed if a channel is configured.</p></div>
      <div class="card"><h4>reorder_prescription</h4><p>Offer to reorder a prescription.</p></div>
      <div class="card"><h4>confirm_purchase</h4><p>Place or decline a prepared purchase.</p></div>
      <div class="card"><h4>run_care_agent</h4><p>Reviews everything unowned and asks the fairest person - it only ever asks.</p></div>
    </div>
    <h2 id="admin">Setup &amp; admin</h2>
    <div class="cards">
      <div class="card"><h4>create_household</h4><p>Create a new care circle.</p></div>
      <div class="card"><h4>add_member</h4><p>Add someone to the circle.</p></div>
      <div class="card"><h4>add_medication</h4><p>Add a medication schedule.</p></div>
      <div class="card"><h4>remove_member</h4><p>Remove someone; releases their obligations.</p></div>
    </div>` },

  { id:'resources', group:'Reference', title:'Resources',
    toc:[['list','Resources']],
    body:`
    <div class="crumb">Reference <b>› Resources</b></div>
    <h1>Resources</h1>
    <p class="lead">Read-only MCP resources the client can subscribe to.</p>
    <div class="tablewrap"><table id="list">
      <tr><th>Resource</th><th>What it exposes</th></tr>
      <tr><td><code>me</code></td><td>Who the caller is, and what they're allowed to do.</td></tr>
      <tr><td><code>care-state</code></td><td>The whole folded care state - members, obligations, gaps, events.</td></tr>
      <tr><td><code>care-board</code></td><td>The Care Board as an interactive MCP-UI view (the shared display).</td></tr>
    </table></div>` },

  { id:'endpoints', group:'Reference', title:'HTTP endpoints',
    toc:[['list','Endpoints']],
    body:`
    <div class="crumb">Reference <b>› HTTP endpoints</b></div>
    <h1>HTTP endpoints</h1>
    <p class="lead">The MCP server serves the protocol plus the inbound webhooks. Signature-verified webhooks mount before the JSON parser, so the HMAC is over the raw bytes.</p>
    <div class="tablewrap"><table id="list">
      <tr><th>Method</th><th>Path</th><th>Purpose</th></tr>
      <tr><td><span class="method post">POST</span></td><td><code>/mcp</code></td><td>The MCP endpoint (Streamable HTTP). MCP 2025-11-25 with sessions, or 2026-07-28 with no session: each request carries its protocol version.</td></tr>
      <tr><td><span class="method get">GET</span></td><td><code>/health</code></td><td>Health check (App Runner probes this).</td></tr>
      <tr><td><span class="method post">POST</span></td><td><code>/ring/webhook</code></td><td>Ring events, HMAC-verified → INFERRED note.</td></tr>
      <tr><td><span class="method get">GET</span> <span class="method post">POST</span></td><td><code>/whatsapp/webhook</code></td><td>GET verifies the subscription; POST takes signed replies.</td></tr>
      <tr><td><span class="method post">POST</span></td><td><code>/telegram/webhook</code></td><td>Inbound replies, secret-token gated. Works in a family group.</td></tr>
      <tr><td><span class="method get">GET</span> <span class="method post">POST</span></td><td><code>/oauth/*</code></td><td>OAuth 2.1 + PKCE - present only when a signing secret is set.</td></tr>
    </table></div>` },

  { id:'doors', group:'Reference', title:'Data doors',
    toc:[['matrix','The matrix'],['why','Why not tools']],
    body:`
    <div class="crumb">Reference <b>› Data doors</b></div>
    <h1>Data doors</h1>
    <p class="lead">Real accounts and devices. Each is an inbound webhook or a polled connector; the outbound reply channel sits behind one Notifier seam. Ask <code>get_connections</code> for live status.</p>
    <div class="tablewrap"><table id="matrix">
      <tr><th>Door</th><th>Direction</th><th>How it connects</th></tr>
      <tr><td><b>Google Calendar</b></td><td>poll · in + write-back</td><td>Google OAuth; events → INFERRED appointments; write back to the shared calendar.</td></tr>
      <tr><td><b>Gmail</b></td><td>poll · inbound</td><td>Google OAuth; a matching appointment/refill email → INFERRED item.</td></tr>
      <tr><td><b>Ring</b></td><td>webhook · inbound</td><td>HMAC-verified webhook → INFERRED note. Needs a real device to emit events.</td></tr>
      <tr><td><b>Bee</b></td><td>poll · inbound</td><td>GET /v1/facts + /v1/todos (Bearer); todo → PROPOSED, fact → observation. Always logistical.</td></tr>
      <tr><td><b>WhatsApp</b></td><td>webhook · in + out</td><td>Business Cloud API; outbound asks, signed inbound replies. Business-line sender.</td></tr>
      <tr><td><b>Telegram</b></td><td>webhook · in + out <span class="tag">live</span></td><td>Bot API; outbound asks (DM or family group), secret-token-gated replies. No verification wall.</td></tr>
    </table></div>
    <h2 id="why">Why doors aren't tools</h2>
    <div class="note"><p>A webhook is an inbound push - the agent can't "call Telegram to check for replies." So the transport lives at the edge, but the <i>result</i> is fully actionable through MCP tools, and the connection <i>status</i> is exposed via <code>get_connections</code>.</p></div>` },

  { id:'identity', group:'Reference', title:'Identity & permissions',
    toc:[['resolve','Who is speaking'],['roles','Roles & capabilities']],
    body:`
    <div class="crumb">Reference <b>› Identity &amp; permissions</b></div>
    <h1>Identity &amp; permissions</h1>
    <p class="lead">Who is speaking is established by the session credential - never by the conversation.</p>
    <h2 id="resolve">Who is speaking</h2>
    <p>The production resolver is <code>firstOf(oauthTokens, staticTokens)</code>: an OAuth token resolves first, else a mapped static token. With self-signup on, an authenticated-but-unmapped caller becomes a bootstrap principal who can create their own circle.</p>
    <h2 id="roles">Roles &amp; capabilities</h2>
    <div class="tablewrap"><table>
      <tr><th>Role</th><th>Can do</th></tr>
      <tr><td><code>primary_caregiver</code></td><td>The full circle: assign, manage members and meds, everything below.</td></tr>
      <tr><td><code>caregiver</code></td><td>Log, claim, respond, ask, read - the day-to-day of care.</td></tr>
      <tr><td><code>helper</code></td><td>A paid aide: scoped to the work in front of them.</td></tr>
      <tr><td><code>care_recipient</code></td><td>Log things about themselves; read their own circle.</td></tr>
    </table></div>
    <p>Every tool checks the caller's capability first; households are isolated (an adversarial suite guards the boundary).</p>` },

  { id:'deploy', group:'Operate', title:'Deployment',

    body:`
    <div class="crumb">Operate <b>› Deployment</b></div>
    <h1>Deployment</h1>
    <p class="lead">Two AWS App Runner services share one ECR image, built in the cloud from <code>git archive HEAD</code> - so commit before deploying.</p>
    <h2 id="services">Services</h2>
    <div class="tablewrap"><table>
      <tr><th>Service</th><th>Host</th><th>Role</th></tr>
      <tr><td><code>carecircle-mcp</code></td><td>ypq2dfq2p7…</td><td>The MCP server + webhooks + the agent heartbeat.</td></tr>
      <tr><td><code>carecircle-sim</code></td><td>krqi2tpsif…</td><td>The landing page, the simulation, the console and the Fire TV board; proxies to the MCP server.</td></tr>
    </table></div>
    <h2 id="run">Deploy</h2>
    <pre><code class="language-bash">git commit …                                           # the image is built from HEAD
AWS_PROFILE=conductor ./infra/deploy-mcp.sh            # build and push the image
AWS_PROFILE=conductor aws apprunner start-deployment \
  --service-arn &lt;carecircle-sim or carecircle-mcp ARN&gt;  # pull the new image</code></pre>
    <h2 id="gotchas">Gotchas</h2>
    <div class="note warn"><p>An <b>env change</b> is an <code>update-service</code>; a <b>new image</b> needs an explicit <code>start-deployment</code> - do both, or routes 404 on a stale image.</p><p><code>update-service</code> <b>replaces</b> the whole env map and requires <code>AuthenticationConfiguration.AccessRoleArn</code> - derive from live config so secrets and the ECR access role survive.</p></div>` },

  { id:'env', group:'Operate', title:'Environment',
    toc:[['vars','Variables']],
    body:`
    <div class="crumb">Operate <b>› Environment</b></div>

    <div class="tablewrap"><table id="vars">

      <tr><td>Auth</td><td><code>CARECIRCLE_OAUTH_SECRET</code>, <code>CARECIRCLE_PUBLIC_URL</code>, <code>CARECIRCLE_OAUTH_REDIRECTS</code>, <code>CARECIRCLE_OAUTH_COPIES</code> (<code>off</code>: every connection shares the demo family instead of getting its own copy)</td></tr>
      <tr><td>Ring</td><td><code>RING_HMAC_KEY</code>, <code>RING_HOUSEHOLD_ID</code></td></tr>

    <div class="crumb">Operate <b>› Testing</b></div>
    <h1>Testing</h1>
    <p class="lead">The suite runs on the Node test runner (not vitest).</p>
    <h2 id="run">Run the suite</h2>
    <pre><code class="language-bash">npm test               # 816 tests: unit, adversarial and property-based
npm run typecheck      # tsc --noEmit
npm run lint
npm run format:check   # Prettier, also checked in CI
npm run evals          # tool choice against a real model (needs AWS Bedrock)</code></pre>
    <p>Domain logic is pure and network-free, so most tests need no mocks; connectors are tested against recorded real payloads as fixtures.</p>

    <p><a href="https://github.com/Osiyomeoh/household-sim" target="_blank" rel="noreferrer">household-sim</a> (MIT) is our simulator as its own tool, for any MCP server. <code>check &lt;url&gt;</code> lints a server for what a voice host trips on; <code>run scenarios/*.yaml</code> plays a family's story against it, several people with their own credentials, devices sending signed webhooks, and a story clock. Runs record once and replay free in CI.</p>` },

function App(){
  const [active,setActive] = useState('overview');
  const [tocActive,setTocActive] = useState('');
  const [navOpen,setNavOpen] = useState(false);
  const mainRef = useRef(null);

  const idx = PAGES.findIndex(p=>p.id===active);
  const page = PAGES[idx];
  const prev = PAGES[idx-1], next = PAGES[idx+1];

  // Highlight code and reset scroll + toc when the page changes.
  useEffect(()=>{
    setNavOpen(false);
    document.body.classList.remove('nav-open');
    if(mainRef.current){
      mainRef.current.querySelectorAll('pre code').forEach(el=>{ try{ window.hljs.highlightElement(el); }catch(e){} });
      window.scrollTo(0,0);
    }
    setTocActive(page.toc[0] ? page.toc[0][0] : '');
  },[active]);

  // Scrollspy for the right rail.
  useEffect(()=>{
    const ids = page.toc.map(t=>t[0]);
    const els = ids.map(id=>document.getElementById(id)).filter(Boolean);
    if(!els.length) return;
    const obs = new IntersectionObserver((entries)=>{
      const vis = entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
      if(vis[0]) setTocActive(vis[0].target.id);
    },{rootMargin:'-72px 0px -70% 0px',threshold:0});
    els.forEach(el=>obs.observe(el));
    return ()=>obs.disconnect();
  },[active]);

  const go = (id)=>{ setActive(id); };
  const groups = [...new Set(PAGES.map(p=>p.group))];

  return html`
    <${React.Fragment}>
      <header>
        <button class="burger" onClick=${()=>{setNavOpen(v=>{const n=!v;document.body.classList.toggle('nav-open',n);return n;});}} aria-label="Menu">☰</button>
        <a class="logo" href="/"><span class="dot"></span>We've Got This</a>
        <span class="ver">MCP 2026-07-28</span>
        <div class="search"><span>⌕</span><input placeholder="Search docs…" onInput=${e=>{
          const q=e.target.value.toLowerCase();
          if(!q) return;
          const hit=PAGES.find(p=>p.title.toLowerCase().includes(q));
          if(hit && e.nativeEvent.inputType===undefined) go(hit.id);
        }} onKeyDown=${e=>{ if(e.key==='Enter'){ const q=e.target.value.toLowerCase(); const hit=PAGES.find(p=>p.title.toLowerCase().includes(q)||p.id.includes(q)); if(hit) go(hit.id); } }}/></div>
        <a class="top-link" href="https://github.com/Osiyomeoh/weve-got-this" target="_blank" rel="noreferrer">GitHub ↗</a>
      </header>
      <div class="shell">
        <nav class="side">
          ${groups.map(g=>html`
            <div key=${g}>
              <div class="grp">${g}</div>
              ${PAGES.filter(p=>p.group===g).map(p=>html`
                <a key=${p.id} class=${p.id===active?'active':''} onClick=${()=>go(p.id)}>${p.title}</a>`)}
            </div>`)}
        </nav>
        <main ref=${mainRef}>
          <div dangerouslySetInnerHTML=${{__html:page.body}}></div>
          <div class="pager">
            ${prev ? html`<button onClick=${()=>go(prev.id)}><div class="dir">Previous</div><div class="nm">${prev.title}</div></button>` : html`<span style=${{flex:1}}></span>`}
            ${next ? html`<button class="r" onClick=${()=>go(next.id)}><div class="dir">Next</div><div class="nm">${next.title}</div></button>` : html`<span style=${{flex:1}}></span>`}
          </div>
        </main>
        <aside class="toc">
          <div class="ttl">On this page</div>
          ${page.toc.map(t=>html`<a key=${t[0]} class=${tocActive===t[0]?'active':''} href=${'#'+t[0]}
             onClick=${e=>{e.preventDefault();const el=document.getElementById(t[0]);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});setTocActive(t[0]);}}>${t[1]}</a>`)}
        </aside>
      </div>
      <div class="scrim" onClick=${()=>{setNavOpen(false);document.body.classList.remove('nav-open');}}></div>
    <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
