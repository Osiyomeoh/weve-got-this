<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 950" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      .title{fill:#0f172a;font-size:22px;font-weight:700}
      .h{fill:#0f172a;font-size:15px;font-weight:700}
      .t{fill:#0f172a;font-size:13.5px;font-weight:700}
      .s{fill:#475569;font-size:12px}
      .xs{fill:#64748b;font-size:11.5px}
      .lbl{fill:#64748b;font-size:11px;font-weight:700;letter-spacing:.08em}
      .al{fill:#475569;font-size:11px;font-weight:600;paint-order:stroke;stroke:#fcfcfd;stroke-width:5px;stroke-linejoin:round}
      .client{fill:#f6f7f9;stroke:#cbd2db;stroke-width:1.2}
      .svc{fill:#ffffff;stroke:#cbd2db;stroke-width:1.2}
      .chip{fill:#f3f6fa;stroke:#d5dce6;stroke-width:1}
      .eng{fill:#ecf8f1;stroke:#2f9e5e;stroke-width:1.4}
      .ln{fill:none;stroke:#475569;stroke-width:1.5}
      .dash{stroke-dasharray:6 5}
      .acc{stroke-width:4;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1280" height="950" fill="#ffffff"/>

  <text x="24" y="42" class="title">We've Got This · system architecture</text>
  <text x="24" y="66" class="s">What runs in production today. Solid lines are live; dashed lines are built but not on a family's path.</text>

  <!-- People and devices -->
  <text x="24" y="98" class="lbl">PEOPLE AND DEVICES</text>

  <rect x="24" y="108" width="150" height="78" rx="10" class="client"/>
  <text x="38" y="135" class="t">Fire TV</text>
  <text x="38" y="155" class="s">Vega app + remote</text>
  <text x="38" y="172" class="xs">Vega Virtual Device</text>

  <rect x="186" y="108" width="150" height="78" rx="10" class="client"/>
  <text x="200" y="135" class="t">Web browser</text>
  <text x="200" y="155" class="s">console, 3D world</text>
  <text x="200" y="172" class="xs">/proof, /docs</text>

  <rect x="348" y="108" width="200" height="78" rx="10" class="client"/>
  <text x="362" y="135" class="t">Amazon Echo</text>
  <text x="362" y="155" class="s">Alexa skill "care circle"</text>
  <text x="362" y="172" class="xs">voice</text>

  <rect x="560" y="108" width="160" height="78" rx="10" class="client"/>
  <text x="574" y="135" class="t">Any MCP client</text>
  <text x="574" y="155" class="s">Claude, MCPJam,</text>
  <text x="574" y="172" class="xs">MCP Inspector</text>

  <rect x="732" y="108" width="170" height="78" rx="10" class="client"/>
  <text x="746" y="135" class="t">Telegram</text>
  <text x="746" y="155" class="s">the family's phones,</text>
  <text x="746" y="172" class="xs">in any country</text>

  <rect x="914" y="108" width="160" height="78" rx="10" class="client"/>
  <text x="928" y="135" class="t">Ring doorbell</text>
  <text x="928" y="155" class="s">door events</text>
  <text x="928" y="172" class="xs">simulated device</text>

  <rect x="1086" y="108" width="170" height="78" rx="10" class="client"/>
  <text x="1100" y="135" class="t">Google</text>
  <text x="1100" y="155" class="s">Calendar, Gmail invites</text>
  <text x="1100" y="172" class="xs">needs a linked account</text>

  <!-- AWS cloud -->
  <rect x="12" y="208" width="1256" height="664" rx="14" fill="#fcfcfd" stroke="#232f3e" stroke-width="1.5"/>
  <text x="28" y="860" class="lbl" fill="#232f3e">AWS CLOUD · US-EAST-1</text>

  <!-- The Alexa path: skill, Lambda, the bridge on AgentCore -->
  <rect x="348" y="244" width="200" height="38" rx="8" class="svc"/>
  <line x1="360" y1="253" x2="360" y2="273" stroke="#ED7100" class="acc"/>
  <text x="372" y="268"><tspan class="t">AWS Lambda</tspan><tspan class="s"> · skill endpoint</tspan></text>

  <rect x="348" y="296" width="200" height="66" rx="8" class="svc"/>
  <line x1="360" y1="306" x2="360" y2="352" stroke="#01A88D" class="acc"/>
  <text x="372" y="317" class="t">AgentCore Runtime</text>
  <text x="372" y="335" class="s">alexa-skill-mcp-bridge</text>
  <text x="372" y="351" class="xs">Strands agent on Nova Pro</text>

  <!-- carecircle-sim -->
  <rect x="36" y="392" width="290" height="276" rx="12" class="svc"/>
  <rect x="48" y="404" width="266" height="44" rx="7" class="chip"/>
  <text x="60" y="422" class="t">React app</text>
  <text x="60" y="439" class="xs">console, 3D world, /tv, /proof</text>
  <rect x="48" y="456" width="266" height="44" rx="7" class="chip"/>
  <text x="60" y="474" class="t">Planner loop</text>
  <text x="60" y="491" class="xs">an MCP host, on Bedrock</text>
  <rect x="48" y="508" width="266" height="44" rx="7" class="chip"/>
  <text x="60" y="526" class="t">Speech</text>
  <text x="60" y="543" class="xs">Transcribe in, Polly out</text>
  <rect x="48" y="560" width="266" height="44" rx="7" class="chip"/>
  <text x="60" y="578" class="t">Per-visitor sandboxes</text>
  <text x="60" y="595" class="xs">each its own copy of the demo family</text>
  <line x1="52" y1="626" x2="52" y2="656" stroke="#ED7100" class="acc"/>
  <text x="64" y="638" class="h">carecircle-sim</text>
  <text x="64" y="656" class="xs">AWS App Runner · Node.js, Express</text>

  <!-- carecircle-mcp -->
  <rect x="372" y="392" width="872" height="276" rx="12" class="svc"/>

  <rect x="384" y="404" width="324" height="46" rx="7" class="chip"/>
  <text x="396" y="423" class="t">/mcp · Streamable HTTP</text>
  <text x="396" y="440" class="xs">MCP 2025-11-25 and 2026-07-28 · OAuth 2.1 + PKCE</text>
  <rect x="732" y="404" width="170" height="46" rx="7" class="chip"/>
  <text x="744" y="423" class="t">/telegram/webhook</text>
  <text x="744" y="440" class="xs">the sender is the member</text>
  <rect x="914" y="404" width="152" height="46" rx="7" class="chip"/>
  <text x="926" y="423" class="t">/ring/webhook</text>
  <text x="926" y="440" class="xs">HMAC-verified</text>
  <rect x="1078" y="404" width="154" height="46" rx="7" class="chip"/>
  <text x="1090" y="423" class="t">Connector sync</text>
  <text x="1090" y="440" class="xs">on a heartbeat</text>

  <rect x="384" y="462" width="324" height="56" rx="7" class="chip"/>
  <text x="396" y="481" class="t">MCP server</text>
  <text x="396" y="497" class="xs">31 tools · resources · prompts</text>
  <text x="396" y="511" class="xs">2 MCP Apps: the Care Board, the week's promises</text>
  <rect x="732" y="462" width="170" height="56" rx="7" class="chip"/>
  <text x="744" y="481" class="t">Telegram planner</text>
  <text x="744" y="497" class="xs">Strands agent + NoBlame</text>
  <text x="744" y="511" class="xs">same tools, in-process</text>
  <rect x="914" y="462" width="318" height="56" rx="7" class="chip"/>
  <text x="926" y="481" class="t">Background loops</text>
  <text x="926" y="497" class="xs">agent pass: asks the free person, never assigns</text>
  <text x="926" y="511" class="xs">reminders · routines a day ahead · connectors</text>

  <rect x="384" y="530" width="518" height="76" rx="7" class="eng"/>
  <text x="396" y="550" class="t" fill="#14532d">Domain engine · deterministic, no LLM</text>
  <text x="396" y="568" class="xs" fill="#2f6b45">provenance: a missing record is "no record", never "missed"</text>
  <text x="396" y="583" class="xs" fill="#2f6b45">gap ranking: cost × P(dropped) × confidence</text>
  <text x="396" y="598" class="xs" fill="#2f6b45">agent policy: act only when harm avoided outweighs the interruption</text>
  <rect x="914" y="530" width="152" height="76" rx="7" class="chip"/>
  <text x="926" y="550" class="t">Notifier</text>
  <text x="926" y="568" class="xs">Telegram: live</text>
  <text x="926" y="583" class="xs">WhatsApp, SNS: built,</text>
  <text x="926" y="598" class="xs">not in use</text>
  <rect x="1078" y="530" width="154" height="76" rx="7" class="chip"/>
  <text x="1090" y="550" class="t">Event store</text>
  <text x="1090" y="568" class="xs">append-only</text>
  <text x="1090" y="583" class="xs">every write carries</text>
  <text x="1090" y="598" class="xs">who said so</text>

  <line x1="388" y1="626" x2="388" y2="656" stroke="#ED7100" class="acc"/>
  <text x="400" y="638" class="h">carecircle-mcp</text>
  <text x="400" y="656" class="xs">AWS App Runner · Node.js, Express</text>

  <!-- Managed services -->
  <rect x="36" y="706" width="638" height="94" rx="10" fill="#f2fbf9" stroke="#01A88D" stroke-width="1.2"/>
  <text x="50" y="724" class="lbl" fill="#017a67">AI AND SPEECH · USED BY BOTH SERVICES</text>
  <rect x="48" y="734" width="300" height="56" rx="7" class="svc"/>
  <text x="60" y="753" class="t">Amazon Bedrock</text>
  <text x="60" y="769" class="xs">Claude Sonnet 4.5: the planner</text>
  <text x="60" y="783" class="xs">Amazon Nova Pro: the Alexa bridge, evals</text>
  <rect x="360" y="734" width="150" height="56" rx="7" class="svc"/>
  <text x="372" y="753" class="t">Amazon Transcribe</text>
  <text x="372" y="769" class="xs">voice in, with the</text>
  <text x="372" y="783" class="xs">family's own names</text>
  <rect x="522" y="734" width="140" height="56" rx="7" class="svc"/>
  <text x="534" y="753" class="t">Amazon Polly</text>
  <text x="534" y="769" class="xs">voice out: replies</text>
  <text x="534" y="783" class="xs">and voice notes</text>

  <rect x="686" y="706" width="166" height="94" rx="10" class="svc dash"/>
  <line x1="698" y1="716" x2="698" y2="790" stroke="#01A88D" class="acc"/>
  <text x="710" y="728" class="t">AgentCore Runtime</text>
  <text x="710" y="746" class="s">carecircle_planner</text>
  <text x="710" y="763" class="xs">deployed; not on a</text>
  <text x="710" y="778" class="xs">family's path yet</text>

  <rect x="864" y="706" width="156" height="94" rx="10" class="svc dash"/>
  <line x1="876" y1="716" x2="876" y2="790" stroke="#E7157B" class="acc"/>
  <text x="888" y="728" class="t">Amazon SNS</text>
  <text x="888" y="746" class="s">fallback channel</text>
  <text x="888" y="763" class="xs">when Telegram is</text>
  <text x="888" y="778" class="xs">not configured</text>

  <rect x="1032" y="706" width="212" height="94" rx="10" class="svc"/>
  <line x1="1044" y1="716" x2="1044" y2="790" stroke="#C925D1" class="acc"/>
  <text x="1056" y="728" class="t">Amazon DynamoDB</text>
  <text x="1056" y="746" class="s">one table: the care record</text>
  <text x="1056" y="763" class="xs">append-only events</text>
  <text x="1056" y="778" class="xs">transactional version check</text>

  <!-- Into the sim -->
  <line x1="99" y1="186" x2="99" y2="402" class="ln" marker-end="url(#a)"/>
  <text x="107" y="300" class="al">HTTPS</text>
  <line x1="261" y1="186" x2="261" y2="402" class="ln" marker-end="url(#a)"/>
  <text x="269" y="300" class="al">HTTPS</text>

  <!-- The Alexa path -->
  <line x1="448" y1="186" x2="448" y2="242" class="ln" marker-end="url(#a)"/>
  <line x1="448" y1="282" x2="448" y2="294" class="ln" marker-end="url(#a)"/>
  <line x1="538" y1="362" x2="538" y2="402" class="ln" marker-end="url(#a)"/>
  <text x="546" y="384" class="al">MCP + OAuth</text>

  <!-- Straight into the MCP server -->
  <line x1="660" y1="186" x2="660" y2="402" class="ln" marker-end="url(#a)"/>
  <text x="668" y="300" class="al">OAuth 2.1 + PKCE</text>
  <line x1="817" y1="188" x2="817" y2="402" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="825" y="292" class="al">webhook in</text>
  <text x="825" y="307" class="al">Bot API out</text>
  <line x1="990" y1="186" x2="990" y2="402" class="ln" marker-end="url(#a)"/>
  <text x="998" y="300" class="al">HMAC-signed</text>
  <line x1="1155" y1="188" x2="1155" y2="402" class="ln dash" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="1163" y="300" class="al">OAuth</text>

  <!-- Between the services -->
  <line x1="314" y1="482" x2="382" y2="482" class="ln" marker-end="url(#a)"/>
  <text x="348" y="474" class="al" text-anchor="middle">MCP</text>

  <!-- Down to the managed services -->
  <line x1="300" y1="668" x2="300" y2="704" class="ln" marker-end="url(#a)"/>
  <line x1="640" y1="668" x2="640" y2="704" class="ln" marker-end="url(#a)"/>
  <line x1="990" y1="606" x2="990" y2="704" class="ln dash" marker-end="url(#a)"/>
  <line x1="1155" y1="606" x2="1155" y2="704" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M769,800 V826 H1138 V802" class="ln dash" marker-end="url(#a)"/>
  <text x="950" y="842" class="al" text-anchor="middle">reads the same record</text>

  <!-- Legend -->
  <line x1="24" y1="900" x2="60" y2="900" class="ln"/>
  <text x="68" y="904" class="xs">live in production</text>
  <line x1="190" y1="900" x2="226" y2="900" class="ln dash"/>
  <text x="234" y="904" class="xs">built, not on a family's path</text>
  <rect x="420" y="893" width="16" height="14" rx="3" class="eng"/>
  <text x="444" y="904" class="xs">the part that decides: plain code, tested, no model</text>
  <text x="24" y="934" class="s" font-weight="700" fill="#15803d">816 tests · 31 MCP tools · first tool right 168/187 on Claude Sonnet 4.5, 162/187 on Nova Pro under the Alexa bridge's prompt · 0 false accusations</text>
</svg>
