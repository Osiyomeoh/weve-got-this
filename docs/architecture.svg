<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 720" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
    <marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22a45d"/>
    </marker>
    <marker id="arwf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e0a52a"/>
    </marker>
    <style>
      .box{rx:12;stroke-width:2}
      .t{fill:#1f2733;font-size:14px;font-weight:600}
      .tb{fill:#1f2733;font-size:15px;font-weight:700}
      .s{fill:#5b6472;font-size:11px}
      .xs{fill:#8a93a2;font-size:10.5px}
      .lbl{fill:#8a93a2;font-size:11px;font-weight:700;letter-spacing:.09em}
      .aws{fill:#fff5ec;stroke:#ff9900}
      .mcp{fill:#eef4ff;stroke:#3b82f6}
      .eng{fill:#eafaf1;stroke:#22a45d}
      .sig{fill:#f4f6f9;stroke:#c3cad6}
      .trust{fill:#fff8ec;stroke:#e0a52a}
      .hub{fill:#f2fbf6;stroke:#22a45d}
      .n-ev{fill:#eef4ff;stroke:#3b82f6}
      .n-ob{fill:#eafaf1;stroke:#22a45d}
      .n-ow{fill:#fff5ec;stroke:#ff9900}
      .ic{fill:none;stroke:#5b6472;stroke-width:1.6}
    </style>
  </defs>

  <rect width="1360" height="720" fill="#ffffff"/>
  <text x="40" y="46" fill="#1f2733" font-size="24" font-weight="700">CareCircle - System Architecture</text>
  <text x="40" y="68" class="s" font-size="12.5">One responsibility graph — evidence in, accountability out.</text>

  <!-- ============ IN: signals ============ -->
  <text x="40" y="120" class="lbl">SIGNALS</text>
  <rect class="box sig" x="40" y="140" width="150" height="60"/>
  <g class="ic" transform="translate(58,158)"><rect x="0" y="0" width="10" height="16" rx="5"/><path d="M-3 10 a8 8 0 0 0 16 0 M5 18 v4 M0 24 h10"/></g>
  <text x="86" y="166" class="t">Alexa+</text><text x="86" y="184" class="xs">voice</text>
  <rect class="box sig" x="40" y="214" width="150" height="60"/>
  <g class="ic" transform="translate(56,230)"><rect x="0" y="0" width="16" height="22" rx="4"/><circle cx="8" cy="9" r="3.2"/></g>
  <text x="86" y="240" class="t">Ring</text><text x="86" y="258" class="xs">doorbell · HMAC</text>

  <!-- ============ CAPTURE: MCP write ============ -->
  <text x="230" y="120" class="lbl">CAPTURE · MCP tools</text>
  <rect class="box mcp" x="230" y="140" width="180" height="200"/>
  <text x="248" y="166" class="tb">MCP Server</text>
  <text x="248" y="183" class="xs">Streamable HTTP · 23 tools</text>
  <g font-size="10.5" font-weight="600" text-anchor="middle" fill="#2c5fa8">
    <rect x="246" y="196" width="148" height="24" rx="6" fill="#e4eefc" stroke="#bcd3f2"/><text x="320" y="212">log_care_event</text>
    <rect x="246" y="226" width="148" height="24" rx="6" fill="#e4eefc" stroke="#bcd3f2"/><text x="320" y="242">record_appointment</text>
    <rect x="246" y="256" width="148" height="24" rx="6" fill="#e4eefc" stroke="#bcd3f2"/><text x="320" y="272">ingest_signal</text>
    <rect x="246" y="286" width="148" height="24" rx="6" fill="#e4eefc" stroke="#bcd3f2"/><text x="320" y="302">claim / confirm</text>
  </g>

  <!-- ============ HUB: the graph ============ -->
  <text x="450" y="120" class="lbl">SHARED STATE · responsibility graph</text>
  <rect class="box hub" x="450" y="132" width="350" height="238"/>
  <rect class="box n-ev" x="470" y="156" width="96" height="52"/><text x="518" y="178" class="t" text-anchor="middle">Event</text><text x="518" y="195" class="xs" text-anchor="middle">provenance</text>
  <rect class="box n-ob" x="578" y="156" width="112" height="52"/><text x="634" y="178" class="t" text-anchor="middle">Obligation</text><text x="634" y="195" class="xs" text-anchor="middle">must happen</text>
  <rect class="box n-ow" x="702" y="156" width="82" height="52"/><text x="743" y="178" class="t" text-anchor="middle">Owner</text><text x="743" y="195" class="xs" text-anchor="middle">or gap</text>
  <path d="M566 182 H578" stroke="#22a45d" stroke-width="1.8" fill="none" marker-end="url(#arwg)"/>
  <path d="M690 182 H702" stroke="#22a45d" stroke-width="1.8" fill="none" marker-end="url(#arwg)"/>
  <!-- provenance chips -->
  <g font-size="10" font-weight="700" text-anchor="middle">
    <rect x="470" y="224" width="98" height="24" rx="6" fill="#e4eefc" stroke="#3b82f6"/><text x="519" y="240" fill="#2c5fa8">CONFIRMED</text>
    <rect x="576" y="224" width="86" height="24" rx="6" fill="#e7f6ee" stroke="#22a45d"/><text x="619" y="240" fill="#1c8049">INFERRED</text>
    <rect x="670" y="224" width="114" height="24" rx="6" fill="#fff1e0" stroke="#ff9900"/><text x="727" y="240" fill="#c67f14">NOT_LOGGED</text>
  </g>
  <!-- DynamoDB base -->
  <g transform="translate(470,270)">
    <ellipse cx="16" cy="6" rx="15" ry="5" fill="#fff5ec" stroke="#ff9900" stroke-width="1.6"/>
    <path d="M1 6 v22 a15 5 0 0 0 30 0 v-22" fill="#fff5ec" stroke="#ff9900" stroke-width="1.6"/>
    <ellipse cx="16" cy="6" rx="15" ry="5" fill="#fff5ec" stroke="#ff9900" stroke-width="1.6"/>
  </g>
  <text x="512" y="286" class="t">DynamoDB</text><text x="512" y="303" class="xs">append-only log · single table</text>
  <rect class="box trust" x="470" y="322" width="314" height="34"/>
  <text x="627" y="343" class="tb" font-size="13.5" text-anchor="middle" fill="#c67f14">Known ≠ Assumed</text>

  <!-- ============ REASON: engines read ============ -->
  <text x="840" y="120" class="lbl">REASON · deterministic, no LLM</text>
  <rect class="box eng" x="840" y="140" width="220" height="56"/>
  <text x="858" y="164" class="tb">Gap engine</text><text x="858" y="182" class="s">Cost × P(drop) × Confidence</text>
  <rect class="box eng" x="840" y="206" width="220" height="56"/>
  <text x="858" y="230" class="tb">Agent policy</text><text x="858" y="248" class="s">asks family first · only asks</text>
  <rect class="box trust" x="840" y="272" width="220" height="56"/>
  <text x="858" y="296" class="tb">Trust guard</text><text x="858" y="314" class="s">"no record", never "missed"</text>

  <!-- ============ OUT: act / display ============ -->
  <text x="1100" y="120" class="lbl">ACT / DISPLAY</text>
  <rect class="box sig" x="1100" y="140" width="150" height="56"/>
  <g class="ic" transform="translate(1116,152)"><rect x="0" y="0" width="26" height="17" rx="2.5"/><path d="M9 22 h8 M13 17 v5"/></g>
  <text x="1152" y="164" class="t">Fire TV</text><text x="1152" y="182" class="xs">ambient board</text>
  <rect class="box aws" x="1100" y="206" width="150" height="56"/>
  <g class="ic" transform="translate(1118,218)" stroke="#c67f14"><path d="M4 14 a8 8 0 0 1 16 0 v3 l2 3 H2 l2-3 z M9 22 a3 3 0 0 0 6 0"/></g>
  <text x="1152" y="230" class="t">SNS</text><text x="1152" y="248" class="xs">notify a member</text>
  <rect class="box aws" x="1100" y="272" width="150" height="56"/>
  <g class="ic" transform="translate(1116,286)" stroke="#c67f14"><path d="M0 5 h5 l6-5 v18 l-6-5 H0 z M16 5 a5 5 0 0 1 0 8"/></g>
  <text x="1152" y="296" class="t">Polly</text><text x="1152" y="314" class="xs">voice out</text>

  <!-- ===== main flow arrows ===== -->
  <path d="M190 200 C210 200 210 218 230 224" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M190 244 C210 244 210 250 230 256" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M410 240 H450" stroke="#5b6472" stroke-width="2.2" fill="none" marker-end="url(#arw)"/><text x="430" y="232" class="xs" text-anchor="middle">write</text>
  <path d="M800 234 H840" stroke="#22a45d" stroke-width="2.2" fill="none" marker-end="url(#arwg)"/><text x="820" y="226" class="xs" text-anchor="middle">read</text>
  <path d="M1060 168 C1080 168 1082 168 1100 168" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M1060 234 H1100" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M1060 300 C1080 300 1082 300 1100 300" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)"/>

  <!-- ===== human feedback loop ===== -->
  <path d="M1175 328 C1175 430 627 470 627 388" stroke="#e0a52a" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arwf)"/>
  <rect class="box trust" x="720" y="430" width="230" height="34"/>
  <text x="835" y="451" class="t" text-anchor="middle" fill="#c67f14">human confirms / declines</text>

  <!-- ============ SUBSTRATE: runtime + security ============ -->
  <text x="40" y="512" class="lbl">RUNTIME &amp; SECURITY</text>
  <rect x="40" y="524" width="1210" height="86" rx="12" fill="#fafbfc" stroke="#e3e8ef"/>
  <g class="tb" font-size="13" text-anchor="middle">
    <rect class="box aws" x="60" y="544" width="150" height="48"/><text x="135" y="566">Bedrock</text><text x="135" y="582" class="xs" text-anchor="middle">Sonnet 4.5 · planner</text>
    <rect class="box aws" x="228" y="544" width="150" height="48"/><text x="303" y="566">App Runner</text><text x="303" y="582" class="xs" text-anchor="middle">2 services · HTTPS</text>
    <rect class="box aws" x="396" y="544" width="150" height="48"/><text x="471" y="566">Transcribe</text><text x="471" y="582" class="xs" text-anchor="middle">voice in</text>
    <rect class="box mcp" x="600" y="544" width="150" height="48"/><text x="675" y="566">OAuth 2.1</text><text x="675" y="582" class="xs" text-anchor="middle">PKCE · per member</text>
    <rect class="box mcp" x="768" y="544" width="170" height="48"/><text x="853" y="566">Capability gate</text><text x="853" y="582" class="xs" text-anchor="middle">role-scoped tools</text>
    <rect class="box eng" x="956" y="544" width="274" height="48"/><text x="1093" y="566">Free text = data, never instruction</text><text x="1093" y="582" class="xs" text-anchor="middle">injection defense · human-confirmed writes</text>
  </g>

  <!-- footer metric -->
  <text x="40" y="662" class="s" font-weight="700" fill="#22a45d">311 tests · property-based proofs · ~92-93% tool-selection · 0% false accusations</text>
  <g transform="translate(40,678)">
    <rect class="box sig" x="0" y="0" width="13" height="13"/><text x="20" y="11" class="xs">surface</text>
    <rect class="box mcp" x="78" y="0" width="13" height="13"/><text x="98" y="11" class="xs">MCP / security</text>
    <rect class="box eng" x="210" y="0" width="13" height="13"/><text x="230" y="11" class="xs">engine</text>
    <rect class="box aws" x="300" y="0" width="13" height="13"/><text x="320" y="11" class="xs">AWS</text>
    <rect class="box trust" x="378" y="0" width="13" height="13"/><text x="398" y="11" class="xs">trust · feedback</text>
  </g>
</svg>
