name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI checks code, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: care-events package (typecheck and tests)
        run: |
          npx tsc -p packages/care-events --noEmit
          npx tsx --test "packages/care-events/src/**/*.test.ts"

  console:
    name: Console (sim-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sim-ui/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
